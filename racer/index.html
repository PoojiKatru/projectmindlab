<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Apex 3D — a racer</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="race3d.js"></script>
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage">
    <div id="view"></div>

    <div class="hud" id="hud" hidden>
      <div class="hud-tl">
        <div class="tile"><span>LAP</span><strong id="lap">1<i>/3</i></strong></div>
        <div class="tile time"><span>CURRENT</span><strong id="cur">0:00.00</strong></div>
        <div class="tile time"><span>BEST</span><strong id="best">—:—.—</strong></div>
      </div>
      <div class="hud-tr">
        <div class="tile pos"><strong id="pos">1</strong><span id="posord">st</span></div>
        <div class="tile speed"><strong id="kph">0</strong><span>KPH</span></div>
        <div class="split" id="split"></div>
      </div>
      <div class="hud-br"><div class="dial"><canvas id="tacho" width="220" height="220"></canvas>
        <div class="readout"><em id="gear">1</em></div></div></div>
      <div class="pedals" aria-hidden="true">
        <button class="pedal" id="p-brake">BRAKE</button><button class="pedal" id="p-gas">GAS</button>
      </div>
      <div class="wheelpad" aria-hidden="true">
        <button class="pedal" id="p-left">◀</button><button class="pedal" id="p-right">▶</button>
      </div>
    </div>

    <div class="panel" id="panel">
      <div>
        <p class="eyebrow" id="p-eyebrow">Circuit 01 · Ardenne</p>
        <h1 id="p-title">Apex<span>.</span></h1>
        <p id="p-text">Three laps, five rivals. Brake before the corner, not in it.</p>
        <div class="keys" id="p-keys">
          <div><b>↑ / W</b><span>throttle</span></div>
          <div><b>↓ / S</b><span>brake</span></div>
          <div><b>← →</b><span>steer</span></div>
          <div><b>C</b><span>camera</span></div>
        </div>
        <button class="go" id="go">Start race <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <div class="lights" id="lights" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="sr-only" id="say" role="status" aria-live="polite"></p>
  </div>
  <p class="foot">Apex 3D · <span id="fps">–</span> fps · <a href="../racer-flat/">flat version</a></p>
</main>
<noscript>This needs JavaScript.</noscript>
<script>
// If the module never boots — CDN blocked, no WebGL, import map unsupported —
// say so instead of leaving a dead Start button.
window.__apexBooted = false;
setTimeout(function () {
  if (window.__apexBooted) return;
  var t = document.getElementById('p-title'), x = document.getElementById('p-text');
  var e = document.getElementById('p-eyebrow');
  if (!t) return;
  e.textContent = 'Could not start';
  t.textContent = 'No 3D.';
  x.innerHTML = 'The 3D engine did not load — this needs WebGL and access to unpkg.com. '
    + 'The <a href="../racer-flat/" style="color:#ff3b30">flat version</a> works without either.';
  document.getElementById('panel').hidden = false;
}, 6000);
</script>
</body></html>
